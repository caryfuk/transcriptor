[project]
name = "transcriptor"
version = "0.1.0"
description = "Local audio transcription, speaker segmentation and summarization (mlx-whisper + pyannote + ollama)"
requires-python = ">=3.11"
dependencies = [
    "mlx-whisper>=0.4.3",
    "pyannote.audio>=4.0",
    "numpy",
]

[project.scripts]
transcriptor = "transcriptor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
